services:
  mysql:
    image: mysql:8.0
    container_name: marine-dashboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: marine_dashboard
      MYSQL_USER: marine_app
      MYSQL_PASSWORD: marine_app_dev_password
      MYSQL_ROOT_PASSWORD: marine_root_dev_password
    volumes:
      - marine_mysql_data:/var/lib/mysql
      - ./database/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/002_seed_demo_data.sql:/docker-entrypoint-initdb.d/002_seed_demo_data.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marine-dashboard-node
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_NAME: Marine Dashboard
      NODE_ENV: production
      NODE_HOST: 0.0.0.0
      NODE_PORT: 3001
      SESSION_SECRET: marine-dashboard-development-session-secret
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: marine_dashboard
      DB_USER: marine_app
      DB_PASS: marine_app_dev_password
    ports:
      - "3001:3001"

volumes:
  marine_mysql_data:
