<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marine Dashboard • Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
    .auth-card{width:min(460px, 100%); padding:18px}
    .auth-title{font-size:22px;font-weight:900;margin:0}
    .auth-sub{margin:6px 0 0;color:rgba(255,255,255,.65);font-size:13px}
    .field{margin-top:14px}
    .label{font-size:12px;color:rgba(255,255,255,.65);margin-bottom:6px}
    .input{
      width:100%; padding:12px 12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.14);
      color: rgba(255,255,255,.92);
      outline:none;
    }
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .err{margin-top:10px;color:rgba(255,140,140,.95);font-size:12px;display:none}
    .hint{margin-top:10px;color:rgba(255,255,255,.55);font-size:12px}
  </style>
</head>
<body>
  <div class="bg">
    <div class="auth-wrap">
      <div class="auth-card glass">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="dot"></div>
          <div>
            <h1 class="auth-title">Marine Dashboard</h1>
            <div class="auth-sub">Secure access • Prototype</div>
          </div>
        </div>

        <div class="field">
          <div class="label">Email</div>
          <input class="input" id="email" type="email" placeholder="admin@marine.io" />
        </div>

        <div class="field">
          <div class="label">Password</div>
          <input class="input" id="password" type="password" placeholder="••••••••" />
        </div>

        <div class="row2 field">
          <button class="btn" id="loginBtn">Sign in</button>
          <button class="btn ghost" id="demoBtn">Use demo login</button>
        </div>

        <div class="err" id="err">Invalid login.</div>
        <div class="hint">
          Demo credentials: <b>admin@marine.io</b> / <b>admin123</b>
        </div>
      </div>
    </div>
  </div>

  <script src="./login.js"></script>
</body>
</html>
